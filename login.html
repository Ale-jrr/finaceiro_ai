<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Pulse Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0b1220,#0f1b33);font-family:Manrope,sans-serif;color:#e8efff}
    .card{width:min(420px,92vw);padding:26px;border-radius:18px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12)}
    h1{font-family:'Space Grotesk',sans-serif;margin:0 0 8px} p{margin:0 0 16px;color:#9fb0d0}
    input,button{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0d1730;color:#e8efff;margin-bottom:10px}
    button{border:none;background:linear-gradient(120deg,#3b82f6,#22d3ee);font-weight:800;cursor:pointer}
    small{color:#9fb0d0}
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Pulse Finance</h1>
    <p>Entre para acessar seu painel.</p>
    <input id="email" type="email" placeholder="E-mail" required />
    <input id="password" type="password" placeholder="Senha" required />
    <button type="submit">Entrar</button>
    <small>Acesso restrito ao usuário autorizado.</small>
  </form>
  <script>
    const ALLOWED_EMAIL = 'alessandro@pulse.local';
    const ALLOWED_PASSWORD = '1234';

    if (localStorage.getItem('pulse_auth') === '1') {
      location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pass = document.getElementById('password').value;

      if (email !== ALLOWED_EMAIL || pass !== ALLOWED_PASSWORD) {
        alert('Acesso negado. Credenciais inválidas.');
        return;
      }

      localStorage.setItem('pulse_auth', '1');
      localStorage.setItem('pulse_user', ALLOWED_EMAIL);
      location.href = 'index.html';
    });
  </script>
</body>
</html>
