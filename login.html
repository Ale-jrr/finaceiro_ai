<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Zentro Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0b1220,#0f1b33);font-family:Manrope,sans-serif;color:#e8efff}
    .card{width:min(440px,92vw);padding:26px;border-radius:18px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12)}
    h1{font-family:'Space Grotesk',sans-serif;margin:0 0 8px} p{margin:0 0 16px;color:#9fb0d0}
    input,button{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0d1730;color:#e8efff;margin-bottom:10px}
    button{border:none;background:linear-gradient(120deg,#3b82f6,#22d3ee);font-weight:800;cursor:pointer}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,.2);font-weight:600}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="card">
    <form id="loginForm">
      <h1>Zentro Finance</h1>
      <p>Entre para acessar seu painel.</p>
      <input id="email" type="email" placeholder="E-mail" required />
      <input id="password" type="password" placeholder="Senha" required />
      <button type="submit">Entrar</button>
      <button id="showRegister" class="ghost" type="button">Criar conta</button>
    </form>

    <form id="registerForm" class="hidden">
      <h1>Criar Conta</h1>
      <p>Crie um novo acesso para sua plataforma.</p>
      <input id="registerName" type="text" placeholder="Nome" required />
      <input id="registerEmail" type="email" placeholder="E-mail" required />
      <input id="registerPassword" type="password" placeholder="Senha" minlength="6" required />
      <button type="submit">Salvar conta</button>
      <button id="backToLogin" class="ghost" type="button">Voltar ao login</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const ACCOUNTS_KEY = 'pulse_accounts';
    const AUTH_KEY = 'pulse_auth';
    const USER_KEY = 'pulse_user';
    const EMERGENCY_ACCESS = [
      { email: 'alessandro@pulse.local', password: 'FINANCA2026' },
      { email: 'alessandrojunior552@gmail.com', password: 'Juininho0@' }
    ];

    const hasSb = Boolean(window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY);
    const sb = hasSb ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

    function localAccounts() {
      return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]');
    }

    function setLocalAccounts(accounts) {
      localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
    }

    async function ensureAdmin() {
      const admin = { name: 'Alessandro', email: 'alessandro@pulse.local', password: 'FINANCA2026', is_admin: true, is_blocked: false };

      const local = localAccounts();
      if (!local.some(a => a.email === admin.email)) {
        local.push({ id: crypto.randomUUID(), name: admin.name, email: admin.email, password: admin.password, isAdmin: true, isBlocked: false, createdAt: new Date().toISOString() });
        setLocalAccounts(local);
      }

      if (sb) {
        await sb.from('app_users').upsert(admin, { onConflict: 'email' });
      }
    }

    async function getAccounts() {
      if (!sb) return localAccounts();
      const { data } = await sb.from('app_users').select('id,name,email,password,is_admin,is_blocked,created_at');
      const mapped = (data || []).map(u => ({ id: u.id, name: u.name, email: u.email, password: u.password, isAdmin: !!u.is_admin, isBlocked: !!u.is_blocked, createdAt: u.created_at }));
      if (mapped.length) setLocalAccounts(mapped);
      return mapped.length ? mapped : localAccounts();
    }

    if (localStorage.getItem(AUTH_KEY) === '1') location.href = 'index.html';

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    document.getElementById('showRegister').onclick = () => { loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); };
    document.getElementById('backToLogin').onclick = () => { registerForm.classList.add('hidden'); loginForm.classList.remove('hidden'); };

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const emergency = EMERGENCY_ACCESS.find(a => a.email === email && a.password === password);
      if (emergency) {
        localStorage.setItem(AUTH_KEY, '1');
        localStorage.setItem(USER_KEY, email);
        location.href = 'index.html';
        return;
      }
      const account = (await getAccounts()).find(a => a.email === email && a.password === password);
      if (!account) return alert('Acesso negado. Credenciais inválidas.');
      if (account.isBlocked) return alert('Conta bloqueada. Fale com o administrador.');
      localStorage.setItem(AUTH_KEY, '1');
      localStorage.setItem(USER_KEY, account.email);
      location.href = 'index.html';
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim().toLowerCase();
      const password = document.getElementById('registerPassword').value;
      if (!name || !email || password.length < 6) return;

      const existing = await getAccounts();
      if (existing.some(a => a.email === email)) return alert('Já existe conta com esse e-mail.');

      if (sb) {
        const { error } = await sb.from('app_users').insert({ name, email, password, is_admin: false, is_blocked: false });
        if (error) return alert('Erro ao criar conta no banco.');
      }

      const local = localAccounts();
      local.push({ id: crypto.randomUUID(), name, email, password, isAdmin: false, isBlocked: false, createdAt: new Date().toISOString() });
      setLocalAccounts(local);

      alert('Conta criada com sucesso. Faça login.');
      registerForm.reset();
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });

    ensureAdmin();
  </script>
</body>
</html>
